<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Productivity Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📝</text></svg>">
    
    <!-- Core Firebase Compatibility Libraries -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>

    <!-- 🔐 Firebase Login/Signup Auth Screen -->
    <div id="authContainer" class="todo-container" style="margin-bottom: 20px;">
        <h2 id="authTitle">🔐 Member Login</h2>
        <div class="input-section" style="flex-direction: column; gap: 12px;">
            <input type="email" id="authEmail" placeholder="Enter your Email ID...">
            <input type="password" id="authPassword" placeholder="Create or Enter Password...">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="loginBtn" style="flex: 1; background: linear-gradient(135deg, #007bff, #0056b3);">Login</button>
                <button id="signupBtn" style="flex: 1; background: linear-gradient(135deg, #17a2b8, #117a8b);">Sign Up</button>
            </div>
        </div>
        <p id="authMessage" style="font-size: 12px; text-align: center; color: red; margin-top: 10px; font-weight: 500;"></p>
    </div>

    <!-- 📊 Main App Container -->
    <div id="appContainer" class="todo-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="userBadge" style="font-size: 11px; font-weight: bold; background: rgba(0,123,255,0.15); color:#007bff; padding:4px 8px; border-radius:20px;">👤 Guest</span>
            <button id="logoutBtn" style="padding: 5px 10px; font-size: 11px; background: #dc3545;">Logout</button>
        </div>
        
        <h2>📝 My Progress Tracker</h2>
        
        <div class="progress-dashboard">
            <h4>📈 Cleared Concepts This Week:</h4>
            <div class="weeks-bar-container">
                <div class="day-bar"><div class="bar" id="bar-Mon"></div><span>Mon</span><small id="date-Mon"></small><small id="count-Mon">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Tue"></div><span>Tue</span><small id="date-Tue"></small><small id="count-Tue">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Wed"></div><span>Wed</span><small id="date-Wed"></small><small id="count-Wed">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Thu"></div><span>Thu</span><small id="date-Thu"></small><small id="count-Thu">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Fri"></div><span>Fri</span><small id="date-Fri"></small><small id="count-Fri">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Sat"></div><span>Sat</span><small id="date-Sat"></small><small id="count-Sat">0</small></div>
                <div class="day-bar"><div class="bar" id="bar-Sun"></div><span>Sun</span><small id="date-Sun"></small><small id="count-Sun">0</small></div>
            </div>
        </div>

        <input type="text" id="searchInput" placeholder="🔍 Search tasks...">

        <div class="input-section" style="margin-top: 15px; margin-bottom: 5px;">
            <input type="text" id="taskInput" placeholder="Write a new task...">
            <button id="addBtn">Add</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 20px; padding-left: 5px;">
            <input type="checkbox" id="routineCheckbox" style="cursor: pointer; width: 15px; height: 15px;">
            <label for="routineCheckbox" style="font-size: 12px; cursor: pointer; opacity: 0.8; font-weight: 500;">Set as Daily Routine (Repeat tomorrow 🔄)</label>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>
        <button id="clearAllBtn" class="clear-btn">🧹 Clear All Tasks</button>
    </div>

    <!-- 🚀 INLINE UNIFIED JAVASCRIPT LOGIC -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBqCxS1nHfYDZyhVuqiU0ty9A6FonFFHhk",
          authDomain: "://firebaseapp.com",
          projectId: "my-pro-tracker-82de4",
          storageBucket: "://appspot.com",
          messagingSenderId: "166118917060",
          appId: "1:166118917060:web:1cc6ae4b25d6d4baa95f83"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const authContainer = document.getElementById('authContainer');
        const appContainer = document.getElementById('appContainer');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authMessage = document.getElementById('authMessage');
        const userBadge = document.getElementById('userBadge');

        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const themeToggle = document.getElementById('themeToggle');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const routineCheckbox = document.getElementById('routineCheckbox');

        let currentUser = null;
        let userTasks = [];
        let userHistory = [];
        let currentFilter = 'all';

        const dashboardDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                authContainer.style.display = 'none';
                appContainer.style.display = 'block';
                userBadge.innerText = `👤 ${user.email.split('@')[0]}`;
                authMessage.innerText = "";
                await syncFromCloud();
                checkAndSmartRolloverTasks();
                updateWeekDatesUI();
                renderTasksUI();
                updateDashboardUI();
            } else {
                currentUser = null;
                authContainer.style.display = 'block';
                appContainer.style.display = 'none';
            }
        });

        signupBtn.addEventListener('click', function() {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            if(!email || !password) {
                authMessage.style.color = "red";
                authMessage.innerText = "Please enter both Email and Password.";
                return;
            }
            authMessage.style.color = "orange";
            authMessage.innerText = "Creating account...";
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    authMessage.style.color = "green";
                    authMessage.innerText = "Account Created Successfully!";
                })
                .catch((err) => {
                    authMessage.style.color = "red";
                    authMessage.innerText = err.message;
                });
        });

        loginBtn.addEventListener('click', function() {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            if(!email || !password) {
                authMessage.style.color = "red";
                authMessage.innerText = "Please enter both Email and Password.";
                return;
            }
            authMessage.style.color = "orange";
            authMessage.innerText = "Verifying...";
            auth.signInWithEmailAndPassword(email, password)
                .catch((err) => {
                    authMessage.style.color = "red";
                    authMessage.innerText = "Invalid credentials or user doesn't exist.";
                });
        });

        logoutBtn.addEventListener('click', function() {
            auth.signOut().then(() => {
                userTasks = [];
                userHistory = [];
                authEmail.value = "";
                authPassword.value = "";
                authMessage.innerText = "";
            });
        });

        async function syncToCloud() {
            if (!currentUser) return;
            try {
                await db.collection("users").doc(currentUser.uid).set({
                    tasks: userTasks,
                    history: userHistory,
                    lastOpenedDate: localStorage.getItem('lastOpenedDate') || ""
                });
            } catch(e) { console.error(e); }
        }

        async function syncFromCloud() {
            if (!currentUser) return;
try {const docSnap = await db.collection("users").doc(currentUser.uid).get();if (docSnap.exists) {const data = docSnap.data();userTasks = data.tasks || [];userHistory = data.history || [];if(data.lastOpenedDate) localStorage.setItem('lastOpenedDate', data.lastOpenedDate);}} catch(e) { console.error(e); }}function checkAndSmartRolloverTasks() {const now = new Date();const todayStr = ${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()};const lastOpenedDate = localStorage.getItem('lastOpenedDate');if (!lastOpenedDate) {localStorage.setItem('lastOpenedDate', todayStr);return;}if (lastOpenedDate !== todayStr) {const timeStr = ${now.getDate()} ${months[now.getMonth()]} at ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')};const dayCreated = daysOfWeek[now.getDay()];const routineTasksToKeep = userTasks.filter(task => task.isRoutine === true);userTasks = routineTasksToKeep.map(oldTask => ({id: (Date.now() + Math.random()).toString(),text: oldTask.text,completed: false,time: timeStr,day: dayCreated,isRoutine: true}));localStorage.setItem('lastOpenedDate', todayStr);syncToCloud();}}function updateWeekDatesUI() {const today = new Date();const currentDayIndex = today.getDay();const distanceToMonday = currentDayIndex === 0 ? -6 : 1 - currentDayIndex;const mondayDate = new Date(today);mondayDate.setDate(today.getDate() + distanceToMonday);dashboardDays.forEach((day, index) => {const loopDate = new Date(mondayDate);loopDate.setDate(mondayDate.getDate() + index);const dateString = ${loopDate.getDate()} ${months[loopDate.getMonth()]};const dateElement = document.getElementById(date-${day});if (dateElement) dateElement.innerText = dateString;});}function addTask() {const taskText = taskInput.value.trim();if (taskText === "") return;const now = new Date();const timeStr = ${now.getDate()} ${months[now.getMonth()]} at ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')};const dayCreated = daysOfWeek[now.getDay()];const taskObj = {id: Date.now().toString(),text: taskText,completed: false,time: timeStr,day: dayCreated,isRoutine: routineCheckbox.checked};userTasks.push(taskObj);taskInput.value = "";routineCheckbox.checked = false;renderTasksUI();syncToCloud();}function renderTasksUI() {taskList.innerHTML = "";userTasks.forEach(taskObj => {const li = document.createElement('li');li.setAttribute('data-id', taskObj.id);const routineTag = taskObj.isRoutine ?  <span style="font-size:10px; color:#007bff; background:rgba(0,123,255,0.1); padding:2px 5px; border-radius:4px; margin-left:5px;">🔄 Daily</span> : '';li.innerHTML = <div> <span>${taskObj.text}${routineTag}</span> <span class="task-time">⏰ ${taskObj.time} (${taskObj.day})</span> </div>;if (taskObj.completed) li.classList.add('completed');li.addEventListener('click', () => {taskObj.completed = !taskObj.completed;if (taskObj.completed) {userHistory.push({ id: taskObj.id, day: taskObj.day });} else {userHistory = userHistory.filter(log => log.id !== taskObj.id);}renderTasksUI();updateDashboardUI();syncToCloud();});const deleteBtn = document.createElement('button');deleteBtn.innerText = "X";deleteBtn.classList.add('delete-btn');deleteBtn.onclick = (e) => {e.stopPropagation();userTasks = userTasks.filter(t => t.id !== taskObj.id);userHistory = userHistory.filter(log => log.id !== taskObj.id);renderTasksUI();updateDashboardUI();syncToCloud();};li.appendChild(deleteBtn);taskList.appendChild(li);});filterAndSearchTasks();}function updateDashboardUI() {let progressData = { Mon: 0, Tue: 0, Wed: 0, Thu: 0, Fri: 0, Sat: 0, Sun: 0 };userHistory.forEach(log => {if (progressData[log.day] !== undefined) progressData[log.day] += 1;});Object.keys(progressData).forEach(day => {const count = progressData[day];const barElement = document.getElementById(bar-${day});const countElement = document.getElementById(count-${day});if(barElement && countElement) {countElement.innerText = count;barElement.style.height = ${Math.min(count * 15, 60)}px;}});}function filterAndSearchTasks() {const searchText = searchInput.value.toLowerCase();taskList.querySelectorAll('li').forEach(li => {const taskText = li.querySelector('span').innerText.toLowerCase();const isCompleted = li.classList.contains('completed');const matchesSearch = taskText.includes(searchText);let matchesFilter = currentFilter === 'all' || (currentFilter === 'completed' && isCompleted) || (currentFilter === 'active' && !isCompleted);li.style.display = (matchesSearch && matchesFilter) ? 'flex' : 'none';});}addBtn.addEventListener('click', addTask);taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });searchInput.addEventListener('input', filterAndSearchTasks);clearAllBtn.addEventListener('click', () => {if (confirm("Clear current task list from cloud server?")) {userTasks = [];renderTasksUI();syncToCloud();}});filterButtons.forEach(btn => {btn.addEventListener('click', (e) => {document.querySelector('.filter-btn.active').classList.remove('active');e.target.classList.add('active');currentFilter = e.target.getAttribute('data-filter');filterAndSearchTasks();});});themeToggle.addEventListener('click', () => {document.body.classList.toggle('dark-theme');localStorage.setItem('darkMode', document.body.classList.contains('dark-theme') ? 'enabled' : 'disabled');});if (localStorage.getItem('darkMode') === 'enabled') {document.body.classList.add('dark-theme');themeToggle.innerText = "☀️ Light Mode";}
